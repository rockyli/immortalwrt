name: UFI firmware
on:
  push:
    branches: [ufi-msm8916]
  workflow_dispatch:
    inputs:
      board:
        description: PCB
        type: choice
        options: [UFI001C_MB_V01, UFI003C_MB_V02]
        default: UFI001C_MB_V01
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      BOARD: ${{ inputs.board || 'UFI001C_MB_V01' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare build host
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++-multilib gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget libelf-dev android-sdk-libsparse-utils
          git clone --depth 1 --branch android-14.0.0_r1 https://android.googlesource.com/platform/system/tools/mkbootimg "$RUNNER_TEMP/android-boot-tools"
          test "$(git -C "$RUNNER_TEMP/android-boot-tools" rev-parse HEAD)" = 028bdc06ce87ab1ee23204feb5cd5ee406484618
          sudo ln -s "$RUNNER_TEMP/android-boot-tools/mkbootimg.py" /usr/local/bin/mkbootimg
          truncate -s 4096 "$RUNNER_TEMP/kernel-test"
          mkbootimg --kernel "$RUNNER_TEMP/kernel-test" --ramdisk /dev/null -o "$RUNNER_TEMP/boot-test.img"
          img2simg "$RUNNER_TEMP/kernel-test" "$RUNNER_TEMP/sparse-test.img"
      - name: Install pinned feeds and select PCB
        run: |
          cp ufi/feeds.conf feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat ufi/common.config "ufi/$BOARD.config" > .config
          make defconfig
          while read -r required; do
            grep -Fqx "$required" .config || { echo "Unresolved option $required"; exit 1; }
          done < <(grep -h '^CONFIG_' ufi/common.config "ufi/$BOARD.config")
      - name: Build
        run: |
          make -j8 download
          make -j"$(nproc)" || make -j1 V=s
      - name: Verify and stage images
        run: |
          case "$BOARD" in
            UFI001C_MB_V01) profile=ufi001c ;;
            UFI003C_MB_V02) profile=ufi003 ;;
          esac
          dest="$PWD/artifacts/$BOARD"
          mkdir -p "$dest"
          cp .config ufi/feeds.conf "$dest"
          scripts/diffconfig.sh > "$dest/diffconfig"
          git rev-parse HEAD > "$dest/source.sha"
          cd bin/targets/msm89xx/msm8916
          for part in boot system; do
            image="immortalwrt-msm89xx-msm8916-openstick-$profile-ext4-$part.img"
            test -s "$image"
            grep -F "$image" sha256sums | sha256sum -c -
            cp "$image" "$dest"
          done
          cp *.manifest "$dest"
          cd "$dest"
          sha256sum *.img | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BOARD }}-${{ github.sha }}
          path: artifacts/
          include-hidden-files: true
