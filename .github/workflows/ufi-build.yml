name: UFI firmware
on:
  push:
    branches: [ufi-msm8916]
  workflow_dispatch:
    inputs:
      board:
        description: PCB
        type: choice
        options: [UFI001C_MB_V01, UFI003C_MB_V02]
        default: UFI001C_MB_V01
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      BOARD: ${{ inputs.board || 'UFI001C_MB_V01' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare build host
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++-multilib gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget libelf-dev android-sdk-libsparse-utils
          git clone --depth 1 --branch android-14.0.0_r1 https://android.googlesource.com/platform/system/tools/mkbootimg "$RUNNER_TEMP/android-boot-tools"
          test "$(git -C "$RUNNER_TEMP/android-boot-tools" rev-parse HEAD)" = 028bdc06ce87ab1ee23204feb5cd5ee406484618
          sudo ln -s "$RUNNER_TEMP/android-boot-tools/mkbootimg.py" /usr/local/bin/mkbootimg
          truncate -s 4096 "$RUNNER_TEMP/kernel-test"
          mkbootimg --kernel "$RUNNER_TEMP/kernel-test" --ramdisk /dev/null -o "$RUNNER_TEMP/boot-test.img"
          img2simg "$RUNNER_TEMP/kernel-test" "$RUNNER_TEMP/sparse-test.img"
      - name: Install pinned feeds and select PCB
        run: |
          cp ufi/feeds.conf feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat ufi/common.config "ufi/$BOARD.config" > .config
          make defconfig
          while read -r required; do
            grep -Fqx "$required" .config || { echo "Unresolved option $required"; exit 1; }
          done < <(grep -h '^CONFIG_' ufi/common.config "ufi/$BOARD.config")
      - name: Build
        run: |
          make -j8 download
          make -j"$(nproc)" || make -j1 V=s
      - name: Verify and stage images
        run: |
          set -euxo pipefail
          case "$BOARD" in
            UFI001C_MB_V01) profile=ufi001c ;;
            UFI003C_MB_V02) profile=ufi003 ;;
          esac
          dest="$PWD/artifacts/$BOARD"
          mkdir -p "$dest"
          cp .config ufi/feeds.conf "$dest"
          scripts/diffconfig.sh > "$dest/diffconfig"
          git rev-parse HEAD > "$dest/source.sha"
          cd bin/targets/msm89xx/msm8916
          ls -lh
          for part in boot system; do
            shopt -s nullglob
            candidates=( *"-openstick-$profile-ext4-$part.img" *"-openstick-$profile-ext4-$part.img.gz" )
            test "${#candidates[@]}" = 1
            image=${candidates[0]}
            test -s "$image"
            grep -F "$image" sha256sums | sha256sum -c -
            if [[ "$image" == *.gz ]]; then
              gzip -dc "$image" > "$dest/${image%.gz}"
            else
              cp "$image" "$dest/"
            fi
          done
          cp *.manifest "$dest"
          grep -F "qcom-msm8916-modem-openstick-$profile-firmware" *.manifest
          if [[ "$profile" == ufi001c ]]; then
            candidates=( *"-openstick-$profile-ext4-sysupgrade.tar" *"-openstick-$profile-ext4-sysupgrade.tar.gz" )
            test "${#candidates[@]}" = 1
            package=${candidates[0]}
            grep -F "$package" sha256sums | sha256sum -c -
            if [[ "$package" == *.gz ]]; then
              gzip -dc "$package" > "$dest/${package%.gz}"
            else
              cp "$package" "$dest/"
            fi
            cd "$GITHUB_WORKSPACE"
            export PATH="$PWD/staging_dir/host/bin:$PATH"
            bash ufi/check-upgrade.sh "$dest/${package%.gz}"
          fi
          cd "$dest"
          sha256sum *.img > SHA256SUMS
          if [[ "$profile" == ufi001c ]]; then sha256sum *.tar >> SHA256SUMS; fi
          cat SHA256SUMS
      - name: Check official APK feeds and simulate userspace installs
        run: |
          set -eu
          dest="$PWD/artifacts/$BOARD"
          target=$(find build_dir/target-* -maxdepth 1 -type d -name 'root-msm89xx' -print -quit)
          test -d "$target/etc/apk"
          if ! bash ufi/check-apk.sh "$target" "$PWD/staging_dir/host/bin/apk" > "$dest/apk-compatibility.txt" 2>&1; then
            echo "::warning::Official snapshot simulation was unsuccessful. See apk-compatibility.txt."
          fi
          cat "$dest/apk-compatibility.txt"
      - name: Preserve image output if verification fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: image-diagnostics-${{ github.run_id }}
          path: |
            bin/targets/msm89xx/msm8916/*.img*
            bin/targets/msm89xx/msm8916/*sysupgrade.tar*
            bin/targets/msm89xx/msm8916/sha256sums
            bin/targets/msm89xx/msm8916/*.manifest
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BOARD }}-${{ github.sha }}
          path: artifacts/
          include-hidden-files: true
