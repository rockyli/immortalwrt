name: UFI official APK compatibility
on:
  push:
    branches: [ufi-v25.12.2]
    paths: [.github/workflows/ufi-apk.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Find the latest available 25.12.2 UFI001C ext4 artifact
        id: firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" |
            jq -cse '[
              .[].artifacts[]
              | select(.expired == false and .workflow_run.head_branch == "ufi-v25.12.2")
              | select(.workflow_run.head_repository_id == .workflow_run.repository_id)
              | select(.name == ("ufi-25.12.2-UFI001C_MB_V01-" + .workflow_run.head_sha))
            ] | max_by([.created_at, .id]) // error("No unexpired UFI001C 25.12.2 ext4 artifact found")')
          jq -r '"name=\(.name)\nrun=\(.workflow_run.id)"' <<< "$artifact" >> "$GITHUB_OUTPUT"
          jq '{name,digest,workflow_run}' <<< "$artifact"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.firmware.outputs.name }}
          run-id: ${{ steps.firmware.outputs.run }}
          github-token: ${{ github.token }}
          path: firmware
      - name: Verify official indexes and resolve packages with the image's APK
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils qemu-user-static
          cd firmware/UFI001C_MB_V01
          image=immortalwrt-msm89xx-msm8916-openstick-ufi001c-ext4-system.img
          test -s "$image"
          sha256sum -c SHA256SUMS
          simg2img "$image" "$RUNNER_TEMP/test.ext4"
          root="$RUNNER_TEMP/ufi-root"
          mkdir "$root"
          sudo mount -o loop "$RUNNER_TEMP/test.ext4" "$root"
          trap 'sudo umount "$root"' EXIT
          sudo cp /usr/bin/qemu-aarch64-static "$root/tmp/"
          sudo cp --remove-destination -L /etc/resolv.conf "$root/etc/resolv.conf"
          apk=$(sudo find "$root" -type f -name apk -print -quit)
          guest_apk() { sudo chroot "$root" /tmp/qemu-aarch64-static "${apk#"$root"}" "$@"; }
          cat "$root/etc/apk/repositories.d/distfeeds.list"
          guest_apk --version
          guest_apk update
          for package in tree nano; do
            guest_apk add --simulate "$package"
          done
